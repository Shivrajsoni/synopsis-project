[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "panjab-university-rag"
version = "1.0.0"
description = "Production-grade Retrieval-Augmented Generation (RAG) assistant for Panjab University and UIET Chandigarh."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["rag", "llm", "panjab-university", "uiet", "fastapi", "chromadb", "hybrid-search"]
authors = [
    { name = "Shivraj" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "numpy>=1.26.0",
    "curl_cffi>=0.7.0",
    "cloudscraper>=1.2.71",
    "requests>=2.31.0",
    "urllib3>=2.2.0",
    "trafilatura>=1.12.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "markdownify>=0.12.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "pypdf>=4.2.0",
    "tqdm>=4.66.0",
    "pandas>=2.2.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line too long (handled by formatter / long prompt strings)
    "E402",  # module level import not at top of file (used for sys.path bootstrap)
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]
executionEnvironments = [
  { root = ".", extraPaths = ["."] }
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

